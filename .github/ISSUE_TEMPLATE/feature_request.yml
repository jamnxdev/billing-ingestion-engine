name: Feature request
description: Propose a new capability or a change to existing behavior.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For anything beyond a small fix, please open this issue **before** writing
        code — see [`CONTRIBUTING.md`](../../CONTRIBUTING.md#before-you-start).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or awkward today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How you'd expect this to work. Note any tradeoff you're aware of — this project documents tradeoffs explicitly in `docs/DECISIONS.md`.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
